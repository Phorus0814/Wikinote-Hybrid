    // 에디터 본문 우클릭 대화상자 수립
    function showEditorContextMenu(e) {
      const menu = document.getElementById("editor-context-menu");
      if (!menu) return;
      menu.style.display = "flex";
      menu.style.left = `${e.pageX}px`;
      menu.style.top = `${e.pageY}px`;
    }

    function hideContextMenu() {
      const menu = document.getElementById("tree-context-menu");
      if (menu) menu.style.display = "none";
      const editMenu = document.getElementById("editor-context-menu");
      if (editMenu) editMenu.style.display = "none";
    }

    // 새 문서 우클릭 생성 시 자동 라우팅 네비게이션 연계
    function contextAddSubDoc() {
      if (!contextMenuTargetId) return;
      createNodeUnderParent(contextMenuTargetId);
      hideContextMenu();
    }

    function contextDeleteDoc() {
      if (!contextMenuTargetId) return;
      deleteDocumentNode(contextMenuTargetId);
      hideContextMenu();
    }

    function contextViewBacklinks() {
      if (!contextMenuTargetId) return;
      showBacklinksModal(contextMenuTargetId);
      hideContextMenu();
    }

    function contextCutDoc() {
      if (!contextMenuTargetId || contextMenuTargetId === "doc-root") return;
      clipboardNode = {
        action: 'cut',
        sourceDocId: contextMenuTargetId,
        sourceProjId: appState.activeProjectId,
        data: null
      };
      
      // 사이드바 단독 복사/잘라내기 상황 시에만 복사됨 피드백 처리
      showToast("복사됨");
      hideContextMenu();
    }

    function getSubtreeData(proj, rootId) {
      const doc = proj.documents[rootId];
      if (!doc) return null;
      const data = {
        title: doc.title,
        content: doc.content || "",
        children: []
      };
      if (doc.childIds) {
        doc.childIds.forEach(cId => {
          const childData = getSubtreeData(proj, cId);
          if (childData) data.children.push(childData);
        });
      }
      return data;
    }

    function contextCopyDoc() {
      if (!contextMenuTargetId) return;
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      
      const data = getSubtreeData(proj, contextMenuTargetId);
      if (data) {
        clipboardNode = {
          action: 'copy',
          sourceDocId: contextMenuTargetId,
          sourceProjId: appState.activeProjectId,
          data: data
        };
        showToast("복사됨");
      }
      hideContextMenu();
    }

    function contextPasteDoc() {
      if (!contextMenuTargetId) return;
      executePaste(contextMenuTargetId);
      hideContextMenu();
    }

    // 잘라내기/복사 붙여넣기 연산
    function executePaste(targetParentId) {
      if (!clipboardNode) return;
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;

      if (clipboardNode.action === 'cut') {
        if (clipboardNode.sourceProjId !== appState.activeProjectId) {
          showToast("다른 프로젝트 간 잘라내기는 지원하지 않습니다.");
          return;
        }

        const srcId = clipboardNode.sourceDocId;
        const blacklist = getDescendantIds(srcId);
        if (blacklist.includes(targetParentId)) {
          showToast("자기 자신 또는 하위 문서로는 이동할 수 없습니다.");
          return;
        }

        const srcDoc = proj.documents[srcId];
        if (!srcDoc) return;

        if (srcDoc.parentId && proj.documents[srcDoc.parentId]) {
          const oldParent = proj.documents[srcDoc.parentId];
          oldParent.childIds = oldParent.childIds.filter(id => id !== srcId);
        }

        srcDoc.parentId = targetParentId;
        if (!proj.documents[targetParentId].childIds) {
          proj.documents[targetParentId].childIds = [];
        }
        proj.documents[targetParentId].childIds.push(srcId);

        if (!proj.expandedNodes.includes(targetParentId)) {
          proj.expandedNodes.push(targetParentId);
        }

        const oldLinksMap = getCurrentLinksMap();
        rebuildIndexMaps();
        const newLinksMap = getCurrentLinksMap();

        const changes = [];
        for (const dId in oldLinksMap) {
          if (newLinksMap[dId]) {
            changes.push({
              docId: dId,
              oldLink: oldLinksMap[dId],
              newLink: newLinksMap[dId]
            });
          }
        }
        globalBatchSyncWikiLinks(changes);
        renderTree();
        loadActiveDocument();
        saveStateToCache();

        showToast("문서 위치가 정상적으로 이동되었습니다.");
        clipboardNode = null; 
      } 
      else if (clipboardNode.action === 'copy') {
        function instantiateSubtree(subtreeData, parentId) {
          const newId = 'doc-' + Math.random().toString(36).substr(2, 9);
          proj.documents[newId] = {
            id: newId,
            title: subtreeData.title,
            parentId: parentId,
            childIds: [],
            content: subtreeData.content
          };
          if (subtreeData.children && subtreeData.children.length > 0) {
            subtreeData.children.forEach(childSubtree => {
              const childId = instantiateSubtree(childSubtree, newId);
              proj.documents[newId].childIds.push(childId);
            });
          }
          return newId;
        }

        const newRootId = instantiateSubtree(clipboardNode.data, targetParentId);
        if (!proj.documents[targetParentId].childIds) {
          proj.documents[targetParentId].childIds = [];
        }
        proj.documents[targetParentId].childIds.push(newRootId);

        if (!proj.expandedNodes.includes(targetParentId)) {
          proj.expandedNodes.push(targetParentId);
        }

        const oldLinksMap = getCurrentLinksMap();
        rebuildIndexMaps();
        const newLinksMap = getCurrentLinksMap();

        const changes = [];
        for (const dId in oldLinksMap) {
          if (newLinksMap[dId]) {
            changes.push({
              docId: dId,
              oldLink: oldLinksMap[dId],
              newLink: newLinksMap[dId]
            });
          }
        }
        globalBatchSyncWikiLinks(changes);
        renderTree();
        loadActiveDocument();
        saveStateToCache();

        showToast("하위 기획 구조를 포함한 문서 복제가 완료되었습니다.");
      }
    }

    function toggleNodeExpanded(docId) {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      if (!proj.expandedNodes) proj.expandedNodes = [];

      const index = proj.expandedNodes.indexOf(docId);
      if (index > -1) {
        proj.expandedNodes.splice(index, 1);
      } else {
        proj.expandedNodes.push(docId);
      }

      saveStateToCache();
      renderTree();
    }

    function handleMultiSelect(docId, shiftKey, ctrlKey) {
      if (docId === "doc-root") return;

      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const targetDoc = proj.documents[docId];
      if (!targetDoc) return;
      const parentId = targetDoc.parentId;

      if (selectedNodeIds.length > 0) {
        const firstId = selectedNodeIds[0];
        const firstDoc = proj.documents[firstId];
        if (firstDoc && firstDoc.parentId !== parentId) {
          selectedNodeIds = [];
        }
      }

      if (shiftKey) {
        let siblings = [];
        if (parentId && proj.documents[parentId]) {
          siblings = [...proj.documents[parentId].childIds];
        } else {
          siblings = Object.values(proj.documents)
            .filter(d => d.parentId === null)
            .map(d => d.id);
        }
        siblings = siblings.filter(id => id !== "doc-root");
        selectedNodeIds = siblings;
      } else if (ctrlKey) {
        const idx = selectedNodeIds.indexOf(docId);
        if (idx > -1) {
          selectedNodeIds.splice(idx, 1);
        } else {
          selectedNodeIds.push(docId);
        }
      }

      renderTree();
    }

    function handleTreeMouseDown(e) {
      if (e.target.closest('.node-actions') || e.target.closest('.tree-caret')) return;
      if (e.button !== 0) return; 

      const rowId = e.currentTarget.getAttribute("data-id");
      setupCustomDragStart(rowId, e.clientX, e.clientY);

      window.addEventListener("mousemove", handleGlobalMouseMove);
      window.addEventListener("mouseup", handleGlobalMouseUp);
    }

    function handleTreeTouchStart(e) {
      if (e.target.closest('.node-actions') || e.target.closest('.tree-caret')) return;

      const touch = e.touches[0];
      const rowId = e.currentTarget.getAttribute("data-id");

      e.preventDefault();
      setupCustomDragStart(rowId, touch.clientX, touch.clientY);

      window.addEventListener("touchmove", handleGlobalTouchMove, { passive: false });
      window.addEventListener("touchend", handleGlobalTouchEnd);
    }

    // 마우스 드래그 실시간 무브먼트 핸들러 및 고스트 수립
    function setupCustomDragStart(sourceId, x, y) {
      appState.draggedNodeId = sourceId;
      
      const nodesToDrag = selectedNodeIds.includes(sourceId) ? [...selectedNodeIds] : [sourceId];
      let blacklist = [];
      nodesToDrag.forEach(id => {
        blacklist = blacklist.concat(getDescendantIds(id));
      });
      appState.descendantsBlacklist = blacklist;
      appState.dropPos = null;

      dragInfo.isDragging = false;
      dragInfo.sourceId = sourceId;
      dragInfo.targetId = null;
      dragInfo.startX = x;
      dragInfo.startY = y;
    }

    function handleGlobalMouseMove(e) {
      processDragMove(e.clientX, e.clientY);
    }

    function handleGlobalTouchMove(e) {
      e.preventDefault();
      const touch = e.touches[0];
      processDragMove(touch.clientX, touch.clientY);
    }

    // 드래그 중 캐럿| 추적 및 원본 투명도 0 처리 연산 기동
    function processDragMove(clientX, clientY) {
      if (!dragInfo.sourceId) return;

      dragInfo.lastClientX = clientX;
      dragInfo.lastClientY = clientY;

      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;

      if (!dragInfo.isDragging) {
        const dist = Math.hypot(clientX - dragInfo.startX, clientY - dragInfo.startY);
        if (dist > 5) {
          dragInfo.isDragging = true;
          document.body.classList.add("dragging-active");

          // 원본 드래그 중인 요소를 완전히 투명하게 처리하여 뽑아낸 피드백 제공
          const nodesToDrag = selectedNodeIds.includes(dragInfo.sourceId) ? [...selectedNodeIds] : [dragInfo.sourceId];
          nodesToDrag.forEach(id => {
            const row = document.querySelector(`.tree-row[data-id="${id}"]`);
            if (row) row.style.opacity = "0";
          });
        }
      }

      if (!dragInfo.isDragging) return;

      // 마우스 커서를 역동적으로 뒤따르는 투명 고스트 요소를 실시간 렌더링
      let ghost = document.getElementById("drag-ghost-el");
      if (!ghost) {
        ghost = document.createElement("div");
        ghost.id = "drag-ghost-el";
        ghost.style.position = "fixed";
        ghost.style.pointerEvents = "none";
        ghost.style.zIndex = "10000";
        ghost.style.backgroundColor = "var(--accent-color)";
        ghost.style.color = "#ffffff";
        ghost.style.padding = "6px 12px";
        ghost.style.borderRadius = "4px";
        ghost.style.fontSize = "12px";
        ghost.style.boxShadow = "0 4px 10px rgba(0,0,0,0.3)";
        ghost.style.opacity = "0.9";
        document.body.appendChild(ghost);
      }
      const draggedDoc = proj.documents[dragInfo.sourceId];
      const meta = uuidToMetaMap.get(dragInfo.sourceId);
      ghost.innerText = draggedDoc ? `${meta ? meta.index + '. ' : ''}${draggedDoc.title}` : "이동 중...";
      ghost.style.left = `${clientX + 15}px`;
      ghost.style.top = `${clientY + 15}px`;

      // 에디터 영역 드롭 오프셋 감지 및 전용 가이드 캐럿| 이동
      const editor = document.getElementById("document-editor");
      const overlay = document.getElementById("editor-highlight-overlay");
      const container = document.getElementById("editor-container-box");

      if (editor && overlay && container) {
        const rect = container.getBoundingClientRect();
        const insideEditor = (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom);
        
        if (insideEditor) {
          clearDragIndicators(); // 목차 가이드선 지우기
          
          let range;
          if (document.caretRangeFromPoint) {
            range = document.caretRangeFromPoint(clientX, clientY);
          } else if (document.caretPositionFromPoint) {
            const pos = document.caretPositionFromPoint(clientX, clientY);
            if (pos) {
              range = document.createRange();
              range.setStart(pos.offsetNode, pos.offset);
            }
          }
          
          if (range) {
            const node = range.startContainer;
            const offsetInNode = range.startOffset;
            let absoluteOffset = 0;
            
            const walk = document.createTreeWalker(overlay, NodeFilter.SHOW_TEXT, null, false);
            let n;
            while ((n = walk.nextNode())) {
              if (n === node) break;
              absoluteOffset += n.textContent.length;
            }
            
            const caretIndex = absoluteOffset + offsetInNode;
            
            editor.focus();
            editor.selectionStart = editor.selectionEnd = caretIndex;
            updateFooterStats();
          }
          return; 
        }
      }

      const el = document.elementFromPoint(clientX, clientY);
      if (!el) {
        clearDragIndicators();
        dragInfo.targetId = null;
        return;
      }

      const targetRow = el.closest(".tree-row");
      if (!targetRow) {
        clearDragIndicators();
        dragInfo.targetId = null;
        return;
      }

      const targetId = targetRow.getAttribute("data-id");

      if (appState.descendantsBlacklist.includes(targetId)) {
        clearDragIndicators();
        dragInfo.targetId = null;
        return;
      }

      dragInfo.targetId = targetId;

      const rect = targetRow.getBoundingClientRect();
      const relativeY = clientY - rect.top;
      const height = rect.height;

      clearDragIndicators();

      if (targetId === "doc-root") {
        appState.dropPos = "inside";
        targetRow.classList.add("drag-over-inside");
        return;
      }

      if (relativeY < height * 0.25) {
        targetRow.classList.add("drag-over-before");
        appState.dropPos = "before";
      } else if (relativeY > height * 0.75) {
        targetRow.classList.add("drag-over-after");
        appState.dropPos = "after";
      } else {
        targetRow.classList.add("drag-over-inside");
        appState.dropPos = "inside";
      }
    }

    function handleGlobalMouseUp(e) {
      finalizeDrag();
      window.removeEventListener("mousemove", handleGlobalMouseMove);
      window.removeEventListener("mouseup", handleGlobalMouseUp);
    }

    function handleGlobalTouchEnd(e) {
      finalizeDrag();
      window.removeEventListener("touchmove", handleGlobalTouchMove);
      window.removeEventListener("touchend", handleGlobalTouchEnd);
    }

    // 마우스 마침 및 드롭 가공
    function finalizeDrag() {
      document.body.classList.remove("dragging-active");
      const ghost = document.getElementById("drag-ghost-el");
      if (ghost) ghost.remove();

      const draggedId = dragInfo.sourceId;
      const proj = appState.projects[appState.activeProjectId];

      // 원래 목차 노드 투명도 1로 복원
      if (draggedId) {
        const nodesToDrag = selectedNodeIds.includes(draggedId) ? [...selectedNodeIds] : [draggedId];
        nodesToDrag.forEach(id => {
          const row = document.querySelector(`.tree-row[data-id="${id}"]`);
          if (row) row.style.opacity = "1";
        });
      }

      // 에디터 영역 내부에서 마우스를 놓았을 때의 정밀 링크 자동 주입 분기점
      const editor = document.getElementById("document-editor");
      const container = document.getElementById("editor-container-box");
      if (editor && container && draggedId && dragInfo.isDragging && proj) {
        const rect = container.getBoundingClientRect();
        const insideEditor = (dragInfo.lastClientX >= rect.left && dragInfo.lastClientX <= rect.right && 
                              dragInfo.lastClientY >= rect.top && dragInfo.lastClientY <= rect.bottom);
        if (insideEditor) {
          const insertPos = editor.selectionStart;
          const text = editor.value;
          const draggedDoc = proj.documents[draggedId];
          if (draggedDoc) {
            // [UUID 기반 링크 생성] 0번을 포함한 드롭 링크는 꼬임 없는 고유의 doc-xxxx 양식으로 주입
            const linkText = `[[${draggedId}]]`;
            editor.value = text.substring(0, insertPos) + linkText + text.substring(insertPos);
            editor.selectionStart = editor.selectionEnd = insertPos + linkText.length;
            handleEditorRealtimeInput({ type: "input" }); 
          }
        }
      }

      // [0번 트리 노드 스왑 예외] 최상위 루트는 계층 재배치에서 완전 배제
      if (draggedId !== "doc-root" && dragInfo.isDragging && draggedId && dragInfo.targetId && appState.dropPos && proj) {
        const targetId = dragInfo.targetId;
        const dropPos = appState.dropPos;

        const nodesToDrag = selectedNodeIds.includes(draggedId) ? [...selectedNodeIds] : [draggedId];
        const validNodesToDrag = nodesToDrag.filter(id => id !== "doc-root" && proj.documents[id]);

        if (validNodesToDrag.length > 0) {
          validNodesToDrag.forEach(id => {
            const doc = proj.documents[id];
            if (doc && doc.parentId && proj.documents[doc.parentId]) {
              const oldParent = proj.documents[doc.parentId];
              oldParent.childIds = oldParent.childIds.filter(cid => cid !== id);
            }
          });

          if (dropPos === "inside") {
            validNodesToDrag.forEach(id => {
              const doc = proj.documents[id];
              doc.parentId = targetId;
              if (!proj.documents[targetId].childIds) {
                proj.documents[targetId].childIds = [];
              }
              proj.documents[targetId].childIds.push(id);
            });

            if (!proj.expandedNodes.includes(targetId)) {
              proj.expandedNodes.push(targetId);
            }
          } else {
            const targetDoc = proj.documents[targetId];
            const newParentId = targetDoc.parentId;

            validNodesToDrag.forEach(id => {
              proj.documents[id].parentId = newParentId;
            });

            if (newParentId && proj.documents[newParentId]) {
              const newParent = proj.documents[newParentId];
              let targetIndex = newParent.childIds.indexOf(targetId);

              if (targetIndex === -1) {
                newParent.childIds = newParent.childIds.concat(validNodesToDrag);
              } else {
                const insertIndex = dropPos === "before" ? targetIndex : targetIndex + 1;
                newParent.childIds.splice(insertIndex, 0, ...validNodesToDrag);
              }
            }
          }

          const oldLinksMap = getCurrentLinksMap();
          rebuildIndexMaps();
          const newLinksMap = getCurrentLinksMap();

          const changes = [];
          for (const dId in oldLinksMap) {
            if (newLinksMap[dId]) {
              changes.push({
                docId: dId,
                oldLink: oldLinksMap[dId],
                newLink: newLinksMap[dId]
              });
            }
          }

          globalBatchSyncWikiLinks(changes);
          renderTree();
          loadActiveDocument();
          saveStateToCache();
        }
      }

      // 조기 반환(Early Return)을 완전히 해소하여 모든 드래그 상황이 정상 종료될 때 변수들을 확실하게 초기화
      clearDragIndicators();
      appState.draggedNodeId = null;
      appState.descendantsBlacklist = null;
      dragInfo.isDragging = false;
      dragInfo.sourceId = null;
      dragInfo.targetId = null;
    }

    function getDescendantIds(docId) {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return [];
      let list = [docId];
      const doc = proj.documents[docId];
      if (doc && doc.childIds) {
        doc.childIds.forEach(cId => {
          list = list.concat(getDescendantIds(cId));
        });
      }
      return list;
    }

    function clearDragIndicators() {
      document.querySelectorAll(".tree-row").forEach(el => {
        el.classList.remove("drag-over-before", "drag-over-after", "drag-over-inside");
      });
    }

    // 문서 불러오기 라우팅
    function selectDocument(docId, fromDocId = null, scrollToOffset = null) {
      saveCurrentDocContent();
      const proj = appState.projects[appState.activeProjectId];
      proj.activeDocId = docId;
      
      if (fromDocId) {
        appState.navigatedFromDocId = fromDocId;
      } else {
        appState.navigatedFromDocId = null; 
      }
      
      selectedNodeIds = [];

      loadActiveDocument(scrollToOffset);
      renderTree();
    }

    function saveCurrentDocContent() {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const doc = proj.documents[proj.activeDocId];
      if (doc) {
        const val = document.getElementById("document-editor").value;
        doc.content = val;

        const container = document.getElementById("editor-container-box");
        if (container) {
          if (!appState.scrollPositions) appState.scrollPositions = {};
          appState.scrollPositions[doc.id] = container.scrollTop;
        }
      }
      saveStateToCache();
    }

    function saveCurrentDocTitle() {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const doc = proj.documents[proj.activeDocId];
      if (!doc) return;
      const val = document.getElementById("document-title-input").value.trim();
      if (val && val !== doc.title) {
        const oldLinksMap = getCurrentLinksMap();

        doc.title = val;
        if (doc.id === "doc-root") proj.name = val;
        saveStateToCache();

        rebuildIndexMaps();
        const newLinksMap = getCurrentLinksMap();

        const changes = [];
        for (const dId in oldLinksMap) {
          if (newLinksMap[dId]) {
            changes.push({
              docId: dId,
              oldLink: oldLinksMap[dId],
              newLink: newLinksMap[dId]
            });
          }
        }

        globalBatchSyncWikiLinks(changes);
        renderTree();
        updateBreadcrumbs();
        
        const textarea = document.getElementById("document-editor");
        textarea.value = doc.content || "";
        renderHighlightOverlay();
      }
    }

    // [Case 1] 높이 축소/확장 시 일어나는 브라우저 고유 스크롤바 튕김을 완벽히 교정
    function syncEditorHeight() {
      const textarea = document.getElementById("document-editor");
      const overlay = document.getElementById("editor-highlight-overlay");
      const container = document.getElementById("editor-container-box");
      if (textarea && overlay) {
        const savedScrollTop = container ? container.scrollTop : 0;

        textarea.style.height = 'auto'; 
        const scrollHeight = textarea.scrollHeight;
        textarea.style.height = scrollHeight + 'px';
        overlay.style.height = scrollHeight + 'px';

        if (container) {
          container.scrollTop = savedScrollTop;
        }
      }
    }

    function scrollCursorIntoView() {
      const textarea = document.getElementById("document-editor");
      const container = document.getElementById("editor-container-box");
      if (!textarea || !container) return;

      const selectionEnd = textarea.selectionEnd;
      const textUpToCursor = textarea.value.substring(0, selectionEnd);
      const lines = textUpToCursor.split('\n');
      const cursorLineIndex = lines.length - 1;

      const style = window.getComputedStyle(textarea);
      const lineHeight = parseFloat(style.lineHeight) || 22.75;
      const paddingTop = parseFloat(style.paddingTop) || 20;

      const cursorY = paddingTop + (cursorLineIndex * lineHeight);
      const containerHeight = container.clientHeight;
      const scrollTop = container.scrollTop;

      if (cursorY < scrollTop + paddingTop) {
        container.scrollTop = Math.max(0, cursorY - paddingTop - 10);
      } else if (cursorY + lineHeight > scrollTop + containerHeight) {
        container.scrollTop = cursorY + lineHeight - containerHeight + 20;
      }
    }

    function handleEditorRealtimeInput(e) {
      const textarea = document.getElementById("document-editor");
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const doc = proj.documents[proj.activeDocId];
      if (!doc) return;

      const isEditingTyping = e && (e.type === 'keyup' || e.type === 'input' || e.type === 'keydown' || e.type === 'compositionend');

      doc.content = textarea.value;

      if (isEditingTyping) {
        expandWikiLinksInTextarea(textarea);
      }
      
      saveStateToCache();
      renderHighlightOverlay();
      
      if (isEditingTyping) {
        syncEditorHeight();
        scrollCursorIntoView();
      }

      // [실시간 동기화] 에디터 수정 시 서치 패널 내부의 결과도 자동 갱신
      if (document.getElementById("sidebar-search-panel") && (document.getElementById("sidebar-search-panel").style.display === "flex" || 
          document.getElementById("sidebar-search-panel").style.display === "block")) {
        runSidebarSearch();
      }
    }

    function expandWikiLinksInTextarea(textarea) {
      const value = textarea.value;
      const start = textarea.selectionStart;
      
      const regex = /\[\[([^\]\n]+)\]\]/g;
      let match;
      let newValue = value;
      let offset = 0;
      let changed = false;

      while ((match = regex.exec(value)) !== null) {
        const fullMatch = match[0];
        const linkContent = match[1];

        const targetId = resolveLink(linkContent);
        if (targetId) {
          const proj = appState.projects[appState.activeProjectId];
          const doc = proj.documents[targetId];
          const meta = uuidToMetaMap.get(targetId);
          if (doc && meta) {
            const correctFormat = `${meta.index}. ${doc.title}`;
            if (linkContent.trim() !== correctFormat) {
              const expandedLink = `[[${correctFormat}]]`;
              const matchStart = match.index + offset;
              const matchEnd = matchStart + fullMatch.length;

              newValue = newValue.substring(0, matchStart) + expandedLink + newValue.substring(matchEnd);
              offset += expandedLink.length - fullMatch.length;
              changed = true;
            }
          }
        }
      }

      if (changed) {
        textarea.value = newValue;
        textarea.selectionStart = textarea.selectionEnd = start + offset;
      }
    }

    function escapeHtml(string) {
      return string
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderHighlightOverlay() {
      const textarea = document.getElementById("document-editor");
      const overlay = document.getElementById("editor-highlight-overlay");
      if (!textarea || !overlay) return;

      const text = textarea.value;
      let html = "";
      let currentIndex = 0;

      let matches = [];

      const wikiRegex = /\[\[([^\]]+)\]\]/g; // 줄바꿈을 제하고 대괄호 내 모든 문양을 위키 수집 수용
      let match;
      while ((match = wikiRegex.exec(text)) !== null) {
        if (match.index >= currentIndex) {
          matches.push({
            type: 'wiki',
            start: match.index,
            end: wikiRegex.lastIndex,
            content: match[1],
            raw: match[0]
          });
        }
      }

      const inlineColorRegex = /\$([rgbypocmwlaketivdsfhnuxz123456789])([^$\n]+)\$/g;
      while ((match = inlineColorRegex.exec(text)) !== null) {
        if (match.index >= currentIndex) {
          matches.push({
            type: 'inlineColor',
            start: match.index,
            end: inlineColorRegex.lastIndex,
            color: match[1],
            content: match[2],
            raw: match[0]
          });
        }
      }

      const lineStartRegex = /(?:^|\n)(\$([rgbypocmwlaketivdsfhnuxz123456789])\s+([^\n]*))/g;
      while ((match = lineStartRegex.exec(text)) !== null) {
        const matchRaw = match[1];
        const matchStart = match.index + (match[0].startsWith('\n') ? 1 : 0);
        const matchEnd = matchStart + matchRaw.length;
        if (matchStart >= currentIndex) {
          matches.push({
            type: 'lineColor',
            start: matchStart,
            end: matchEnd,
            color: match[2],
            content: match[3],
            raw: matchRaw
          });
        }
      }

      const commentRegex = /(?:^|\s)\/\/[^\n]*/g;
      while ((match = commentRegex.exec(text)) !== null) {
        if (match.index >= currentIndex) {
          matches.push({
            type: 'comment',
            start: match.index,
            end: commentRegex.lastIndex,
            content: match[0],
            raw: match[0]
          });
        }
      }

      // [Case 3 완결] 찾기/바꾸기 쿼리가 실시간 락킹되어 있다면 정밀 검사 범위에 편입 수용
      if (appState.searchQuery) {
        const q = appState.searchQuery.toLowerCase();
        let sIdx = 0;
        while (true) {
          const idx = text.toLowerCase().indexOf(q, sIdx);
          if (idx === -1) break;
          matches.push({
            type: 'searchMatch',
            start: idx,
            end: idx + q.length,
            content: text.substring(idx, idx + q.length),
            raw: text.substring(idx, idx + q.length)
          });
          sIdx = idx + q.length;
        }
      }

      matches.sort((a, b) => a.start - b.start);
      let filteredMatches = [];
      let lastEnd = currentIndex;
      for (let m of matches) {
        if (m.start >= lastEnd) {
          filteredMatches.push(m);
          lastEnd = m.end;
        }
      }

      for (let m of filteredMatches) {
        if (m.start > currentIndex) {
          html += escapeHtml(text.substring(currentIndex, m.start));
        }

        const escapedContent = escapeHtml(m.content);
        const escapedRaw = escapeHtml(m.raw);

        if (m.type === 'wiki') {
          const targetId = resolveLink(m.content);
          const proj = appState.projects[appState.activeProjectId];
          if (proj && targetId) {
            if (targetId === proj.activeDocId) {
              html += `<span class="code-link-self">${escapedRaw}</span>`;
            } else {
              html += `<span class="code-link-valid" data-target-id="${targetId}">${escapedRaw}</span>`;
            }
          } else {
            html += `<span class="code-link-broken">${escapedRaw}</span>`;
          }
        } 
        else if (m.type === 'inlineColor') {
          const colorHex = colorMap[m.color]?.hex || '#ffffff';
          html += `<span style="color: rgba(255,255,255,0.18);">$${m.color}</span><span style="color: ${colorHex};">${escapedContent}</span><span style="color: rgba(255,255,255,0.18);">$</span>`;
        } 
        else if (m.type === 'lineColor') {
          const colorHex = colorMap[m.color]?.hex || '#ffffff';
          html += `<span style="color: rgba(255,255,255,0.18);">$${m.color} </span><span style="color: ${colorHex};">${escapedContent}</span>`;
        }
        else if (m.type === 'comment') {
          html += `<span style="color: var(--comment-color); font-style: normal;">${escapedRaw}</span>`;
        }
        else if (m.type === 'searchMatch') {
          // [Case 3 완결] 찾기 결과에 대한 미적 회색 투명 강조 처리
          html += `<span class="search-match-highlight">${escapedRaw}</span>`;
        }

        currentIndex = m.end;
      }

      if (currentIndex < text.length) {
        html += escapeHtml(text.substring(currentIndex));
      }

      if (html.endsWith('\n')) {
        html += ' ';
      }

      overlay.innerHTML = html;
    }

    function handleEditorKeyDown(e) {
      const textarea = e.target;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const value = textarea.value;

      if (e.key === 'Tab') {
        e.preventDefault();
        
        const lastNewLine = value.lastIndexOf('\n', start - 1);
        const lineStart = lastNewLine + 1;
        const nextNewLine = value.indexOf('\n', start);
        const lineEnd = nextNewLine === -1 ? value.length : nextNewLine;
        const currentLine = value.substring(lineStart, lineEnd);

        if (e.shiftKey) {
          if (currentLine.startsWith('  ')) {
            const newLine = currentLine.substring(2);
            textarea.value = value.substring(0, lineStart) + newLine + value.substring(lineEnd);
            textarea.selectionStart = textarea.selectionEnd = Math.max(lineStart, start - 2);
          } else if (currentLine.startsWith(' ')) {
            const newLine = currentLine.substring(1);
            textarea.value = value.substring(0, lineStart) + newLine + value.substring(lineEnd);
            textarea.selectionStart = textarea.selectionEnd = Math.max(lineStart, start - 1);
          } else if (currentLine.startsWith('\t')) {
            const newLine = currentLine.substring(1);
            textarea.value = value.substring(0, lineStart) + newLine + value.substring(lineEnd);
            textarea.selectionStart = textarea.selectionEnd = Math.max(lineStart, start - 1);
          }
        } else {
          const tabSpaces = "  ";
          textarea.value = value.substring(0, start) + tabSpaces + value.substring(end);
          textarea.selectionStart = textarea.selectionEnd = start + tabSpaces.length;
        }
        handleEditorRealtimeInput(e);
        return;
      }

      if (e.key === 'Enter' || e.keyCode === 13) {
        if (isComposing) return;
        
        e.preventDefault();

        const lastNewLine = value.lastIndexOf('\n', start - 1);
        const lineStart = lastNewLine + 1;
        const currentLine = value.substring(lineStart, start);

        const indentMatch = currentLine.match(/^([\s\t]*)/);
        const indent = indentMatch ? indentMatch[1] : '';
        const insertText = "\n" + indent;

        textarea.value = value.substring(0, start) + insertText + value.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + insertText.length;
        
        handleEditorRealtimeInput(e);
        return;
      }

      if (e.key === 'Backspace' && start === end) {
        const lastNewLine = value.lastIndexOf('\n', start - 1);
        const lineStart = lastNewLine + 1;
        const currentLine = value.substring(lineStart, start);

        const isOnlyIndent = /^[ \t]+$/.test(currentLine);

        if (isOnlyIndent) {
          e.preventDefault();
          let newIndent = currentLine;
          if (currentLine.endsWith('\t')) {
            newIndent = currentLine.slice(0, -1);
          } else if (currentLine.endsWith('  ')) {
            newIndent = currentLine.slice(0, -2);
          } else {
            newIndent = currentLine.slice(0, -1);
          }
          textarea.value = value.substring(0, lineStart) + newIndent + value.substring(start);
          textarea.selectionStart = textarea.selectionEnd = lineStart + newIndent.length;
          handleEditorRealtimeInput(e);
          return;
        }
      }
    }

    // 새 문서 우클릭 생성 시 자동 라우팅 네비게이션 연계
    function createNodeUnderParent(parentId) {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;

      const newId = 'doc-' + Math.random().toString(36).substr(2, 9);
      
      proj.documents[newId] = {
        id: newId,
        title: "새 문서",
        parentId: parentId,
        childIds: [],
        content: ""
      };

      if (!proj.documents[parentId].childIds) {
        proj.documents[parentId].childIds = [];
      }
      proj.documents[parentId].childIds.push(newId);

      if (!proj.expandedNodes) proj.expandedNodes = [];
      if (!proj.expandedNodes.includes(parentId)) {
        proj.expandedNodes.push(parentId);
      }

      saveStateToCache();
      rebuildIndexMaps();
      renderTree();
      
      selectDocument(newId); // 자동 문서 이동 라우팅
      showToast("새 문서가 생성되어 이동했습니다.");
    }

    }

    function deleteDocumentNode(docId) {
      if (docId === "doc-root") {
        showToast("루트 문서는 삭제할 수 없습니다.");
        return;
      }
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const doc = proj.documents[docId];
      if (!doc) return;

      openCustomConfirm("문서 삭제 확인", `"${doc.title}"문서와 하위 문서들이 영구 삭제됩니다. 진행하시겠습니까?`, () => {
        const oldLinksMap = getCurrentLinksMap();
        const targetIds = getDescendantIds(docId);

        const parentId = doc.parentId;
        if (parentId && proj.documents[parentId]) {
          proj.documents[parentId].childIds = proj.documents[parentId].childIds.filter(id => id !== docId);
        }

        targetIds.forEach(id => {
          delete proj.documents[id];
          proj.expandedNodes = proj.expandedNodes.filter(eId => eId !== id);
        });

        if (targetIds.includes(proj.activeDocId)) {
          proj.activeDocId = "doc-root";
          loadActiveDocument();
        }

        selectedNodeIds = selectedNodeIds.filter(id => !targetIds.includes(id));

        saveStateToCache();
        rebuildIndexMaps();

        const newLinksMap = getCurrentLinksMap();
        const changes = [];
        for (const dId in oldLinksMap) {
          if (newLinksMap[dId]) {
            changes.push({
              docId: dId,
              oldLink: oldLinksMap[dId],
              newLink: newLinksMap[dId]
            });
          }
        }
        globalBatchSyncWikiLinks(changes);

        renderTree();
        showToast("문서가 삭제되었습니다.");
      });
    }

    function performDelete() {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;

      if (selectedNodeIds && selectedNodeIds.length > 0) {
        const targets = selectedNodeIds.filter(id => id !== "doc-root" && proj.documents[id]);
        if (targets.length === 0) return;

        openCustomConfirm("선택 문서 일괄 삭제", "선택된 문서들이 영구 삭제됩니다. 진행하시겠습니까?", () => {
          const oldLinksMap = getCurrentLinksMap();
          let activeDocDeleted = false;

          targets.forEach(docId => {
            const targetIds = getDescendantIds(docId);
            const doc = proj.documents[docId];
            if (!doc) return;

            const parentId = doc.parentId;
            if (parentId && proj.documents[parentId]) {
              proj.documents[parentId].childIds = proj.documents[parentId].childIds.filter(id => id !== docId);
            }

            targetIds.forEach(id => {
              delete proj.documents[id];
              proj.expandedNodes = (proj.expandedNodes || []).filter(eId => eId !== id);
              if (id === proj.activeDocId) {
                activeDocDeleted = true;
              }
            });
          });

          selectedNodeIds = [];

          if (activeDocDeleted) {
            proj.activeDocId = "doc-root";
            loadActiveDocument();
          }

          saveStateToCache();
          rebuildIndexMaps();

          const newLinksMap = getCurrentLinksMap();
          const changes = [];
          for (const dId in oldLinksMap) {
            if (newLinksMap[dId]) {
              changes.push({
                docId: dId,
                oldLink: oldLinksMap[dId],
                newLink: newLinksMap[dId]
              });
            }
          }
          globalBatchSyncWikiLinks(changes);

          renderTree();
          showToast("선택된 문서들이 영구 삭제되었습니다.");
        });
      } 
      else {
        const currentId = proj.activeDocId;
        if (currentId === "doc-root") {
          showToast("루트 문서는 삭제할 수 없습니다.");
          return;
        }
        const doc = proj.documents[currentId];
        if (!doc) return;

        openCustomConfirm("현재 문서 삭제 확인", `"${doc.title}"문서와 하위 문서들이 영구 삭제됩니다. 진행하시겠습니까?`, () => {
          const oldLinksMap = getCurrentLinksMap();
          const targetIds = getDescendantIds(currentId);

          const parentId = doc.parentId;
          if (parentId && proj.documents[parentId]) {
            proj.documents[parentId].childIds = proj.documents[parentId].childIds.filter(id => id !== currentId);
          }

          targetIds.forEach(id => {
            delete proj.documents[id];
            proj.expandedNodes = (proj.expandedNodes || []).filter(eId => eId !== id);
          });

          proj.activeDocId = "doc-root";
          selectedNodeIds = [];

          loadActiveDocument();
          saveStateToCache();
          rebuildIndexMaps();

          const newLinksMap = getCurrentLinksMap();
          const changes = [];
          for (const dId in oldLinksMap) {
            if (newLinksMap[dId]) {
              changes.push({
                docId: dId,
                oldLink: oldLinksMap[dId],
                newLink: newLinksMap[dId]
              });
            }
          }
          globalBatchSyncWikiLinks(changes);

          renderTree();
          showToast("문서가 삭제되었습니다.");
        });
      }

    // 문서 로더
    function loadActiveDocument(scrollToOffset = null) {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const doc = proj.documents[proj.activeDocId];
      if (!doc) return;

      document.getElementById("document-title-input").value = doc.title;
      
      let docContent = doc.content || "";
      docContent = docContent.replace(/\t/g, "  ");
      
      const textarea = document.getElementById("document-editor");
      textarea.value = docContent;

      applySpellcheckState();
      applyTextPreferences();
      renderHighlightOverlay();
      syncEditorHeight();
      updateBreadcrumbs();
      updateMenuToggleIndicators();

      // [Case 1 & Case 3] 스크롤 컨테이너 복구 및 정렬 프로세스
      const container = document.getElementById("editor-container-box");
      if (container && textarea) {
        const docId = proj.activeDocId;

        if (scrollToOffset && typeof scrollToOffset === 'object' && typeof scrollToOffset.charIndex === 'number') {
          // [Case 3 완결] 역링크 수신 시 해당 링크가 뷰포트 센터(중앙)에 위치하도록 스크롤 안착 가이드 작동
          const targetCharIndex = scrollToOffset.charIndex;
          const linkLength = scrollToOffset.length || 0;
          const text = textarea.value;

          if (targetCharIndex >= 0 && targetCharIndex < text.length) {
            const textUpToChar = text.substring(0, targetCharIndex);
            const lineIndex = textUpToChar.split('\n').length - 1;

            const style = window.getComputedStyle(textarea);
            const lineHeight = parseFloat(style.lineHeight) || 22.75;
            const paddingTop = parseFloat(style.paddingTop) || 20;

            const lineY = paddingTop + (lineIndex * lineHeight);
            
            // 링크 선택 및 포커싱 즉시 적용
            textarea.selectionStart = targetCharIndex;
            textarea.selectionEnd = targetCharIndex + linkLength;
            textarea.focus();

            // [Case 3 완결] 지연 안착 타이머 가이드 구동
            setTimeout(() => {
              const containerHeight = container.clientHeight || 500;
              const targetScrollTop = lineY - (containerHeight / 2) + (lineHeight / 2);
              container.scrollTop = Math.max(0, targetScrollTop);
              
              if (!appState.scrollPositions) appState.scrollPositions = {};
              appState.scrollPositions[docId] = container.scrollTop;
              saveStateToCache();
            }, 50);

          } else {
            // 차선 구조 적용
            const savedScroll = (appState.scrollPositions && appState.scrollPositions[docId]) || 0;
            container.scrollTop = savedScroll;
          }
        } else {
          // [Case 1] 마지막으로 머물렀던 스크롤 좌표 복원
          const savedScroll = (appState.scrollPositions && appState.scrollPositions[docId]) || 0;
          container.scrollTop = savedScroll;
        }
      }
      updateFooterStats();
    }

    function updateMenuToggleIndicators() {
      const backlinksMenuBtn = document.getElementById("menu-opt-backlinks");
      if (backlinksMenuBtn) {
        backlinksMenuBtn.innerHTML = ((appState.showTopBacklinks !== false) ? "✓ " : "") + "넘어온 문서 보기/숨기기";

    // 모던 클립보드 복사 API 가공 매핑
    async function copyTextToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("복사됨"); // [피드백 완결] 설명투 배제한 극축약 피드백 표식
      } catch (err) {
        // 보안 또는 구형 환경 대응용 구식 execCommand 폴백 이식
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showToast("복사됨");
        } catch (e) {
          showToast("복사 실패");
        }
        document.body.removeChild(textArea);
      }
    }

    function copyDocumentToClipboardDirect() {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const activeDoc = proj.documents[proj.activeDocId];
      if (!activeDoc) return;

      let path = [];
      let currentId = proj.activeDocId;
      while (currentId) {
        const doc = proj.documents[currentId];
        if (doc) {
          path.unshift(doc);
          currentId = doc.parentId;
        } else {
          break;
        }
      }

      const pathStr = path.map(d => {
        const meta = uuidToMetaMap.get(d.id);
        if (d.id === "doc-root") return d.title;
        const indexStr = meta ? meta.index : "";
        return `${indexStr ? indexStr + "." : ""}${d.title}`;
      }).join(">>");

      const formattedText = `${activeDoc.title}
${pathStr}
${activeDoc.content || ""}`;

      copyTextToClipboard(formattedText);
    }

    // 자녀 포함 병합 복사 (통합본 DFS 구조)
    function copySubtreeToClipboardDirect() {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const activeDoc = proj.documents[proj.activeDocId];
      if (!activeDoc) return;

      let text = `========================================\n`;
      text += `  [자녀포함 통합본] ${activeDoc.title}\n`;
      text += `========================================\n\n`;

      function recurse(docId) {
        const doc = proj.documents[docId];
        if (!doc) return;
        const meta = uuidToMetaMap.get(docId) || { index: "0", title: doc.title };
        text += `${meta.index}. ${doc.title}\n`;
        text += `----------------------------------------\n`;
        text += `${doc.content || ""}\n\n\n`;
        if (doc.childIds) {
          doc.childIds.forEach(cId => recurse(cId));
        }
      }

      recurse(proj.activeDocId);
      copyTextToClipboard(text);
    }

    // 전체 복사 (0번 루트 doc-root 필수 동반 포함)
    function copyAllToClipboardDirect() {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;

      let text = `========================================\n`;
      text += `  [전체 통합본] ${proj.name}\n`;
      text += `========================================\n\n`;

      const sorted = getSortedDocumentsList();
      sorted.forEach(item => {
        text += `${item.index}. ${item.title}\n`;
        text += `----------------------------------------\n`;
        text += `${item.content || ""}\n\n\n`;
      });

      copyTextToClipboard(text);
    }

    // 브레드크럼 분할 드로잉 및 상위 문서 노트 트리 토글 지원
    function updateBreadcrumbs() {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;

      let path = [];
      let currentId = proj.activeDocId;
      while (currentId) {
        const doc = proj.documents[currentId];
        if (doc) {
          path.unshift(doc);
          currentId = doc.parentId;
        } else {
          break;
        }
      }

      const bar = document.getElementById("editor-breadcrumbs-bar");
      if (bar) {
        bar.innerHTML = "";
        
        // [Case 2] 건너옴 복귀 무한 루프 차단
        if (appState.showTopBacklinks !== false && appState.navigatedFromDocId) {
          const navDoc = proj.documents[appState.navigatedFromDocId];
          if (navDoc) {
            const meta = uuidToMetaMap.get(appState.navigatedFromDocId);
            const navTitle = `${navDoc.title}`; // 인덱스 완전 제거

            const histSpan = document.createElement("span");
            histSpan.className = "breadcrumb-history";
            histSpan.innerText = `↩ ${navTitle}에서 건너옴`;
            histSpan.onclick = () => selectDocument(appState.navigatedFromDocId, null);
            bar.appendChild(histSpan);

            const divider = document.createElement("span");
            divider.className = "breadcrumb-separator";
            divider.innerText = " | ";
            bar.appendChild(divider);
          }
        }

        // 노트 트리 토글 상태에 따른 경로 렌더링 스와이프
        if (appState.showParentNodeTree !== false) {
          let visiblePath = [...path];
          let isCollapsed = false;

          if (visiblePath.length > 3) {
            visiblePath = visiblePath.slice(visiblePath.length - 3);
            isCollapsed = true;
          }

          if (isCollapsed) {
            const ellipsisSpan = document.createElement("span");
            ellipsisSpan.className = "breadcrumb-segment";
            ellipsisSpan.style.cursor = "default";
            ellipsisSpan.innerText = "...";
            bar.appendChild(ellipsisSpan);

            const sep = document.createElement("span");
            sep.className = "breadcrumb-separator";
            sep.innerText = " > ";
            bar.appendChild(sep);
          }

          visiblePath.forEach((doc, idx) => {
            const meta = uuidToMetaMap.get(doc.id);
            const indexStr = meta && meta.index !== "0" ? meta.index + ". " : "";
            const segmentText = `${indexStr}${doc.title}`;

            if (idx === visiblePath.length - 1) {
              const activeSpan = document.createElement("span");
              activeSpan.className = "breadcrumb-active";
              activeSpan.innerText = segmentText;
              bar.appendChild(activeSpan);
            } else {
              const linkSpan = document.createElement("span");
              linkSpan.className = "breadcrumb-segment";
              linkSpan.innerText = segmentText;
              linkSpan.onclick = () => selectDocument(doc.id, proj.activeDocId);
              bar.appendChild(linkSpan);

              const sep = document.createElement("span");
              sep.className = "breadcrumb-separator";
              sep.innerText = " > ";
              bar.appendChild(sep);
            }
          });
        }
      }
    }

    // 파일 타입(zip, 7z, txt) 가져오기 가공
    function handleProjectImport(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const extension = file.name.split('.').pop().toLowerCase();

      showToast("파일 기획 복원 분석 중...");

      if (extension === 'zip' || extension === '7z') {
        if (typeof JSZip === 'undefined') {
          showToast("엔진 복원 라이브러리가 유실되었습니다.");
          return;
        }

        const reader = new FileReader();
        reader.onload = async function(e) {
          try {
            const zip = await JSZip.loadAsync(e.target.result);
            const mdFiles = [];
            
            for (const [relativePath, fileInfo] of Object.entries(zip.files)) {
              if (fileInfo.dir || !relativePath.endsWith('.md')) continue;
              
              const fname = relativePath.split('/').pop();
              const match = fname.match(/^([0-9]+(?:\.[0-9]+)*)\.?\s*(.*?)\.md$/);
              if (match) {
                const indexStr = match[1];
                const title = match[2];
                const content = await fileInfo.async("text");
                mdFiles.push({ indexStr, title, content });
              }
            }

            if (mdFiles.length === 0) {
              showToast("복원 규격 대상 파일이 없습니다.");
              return;
            }

            importProjectFromParsedArray(mdFiles);
          } catch (err) {
            console.error(err);
            showToast("압축 패키징 분석 실패.");
          }
          input.value = "";
        };
        reader.readAsArrayBuffer(file);
      } 
      else if (extension === 'txt') {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const fileContent = e.target.result;
            
            if (!fileContent.includes("[통합본]")) {
              showToast("유효한 WHN 통합본 파일 구조가 아닙니다.");
              return;
            }

            let projName = "가져온 프로젝트";
            const projNameMatch = fileContent.match(/\[통합본\]\s*(.*?)\s*기획 문서 목록/);
            if (projNameMatch) {
              projName = projNameMatch[1].trim();
            }

            const headerRegex = /^(0|[1-9]\d*(?:\.[0-9]+)*)\.?\s*([^\n]+)\r?\n-{10,}\r?\n/gm;
            const matches = [];
            let match;
            while ((match = headerRegex.exec(fileContent)) !== null) {
              matches.push({
                index: match.index,
                indexStr: match[1],
                title: match[2].trim(),
                headerLength: match[0].length
              });
            }

            if (matches.length === 0) {
              showToast("가져올 기획서 문서가 없습니다.");
              return;
            }

            const mdFiles = [];
            for (let i = 0; i < matches.length; i++) {
              const current = matches[i];
              const nextIndex = (i + 1 < matches.length) ? matches[i + 1].index : fileContent.length;
              const contentStart = current.index + current.headerLength;
              let docContent = fileContent.substring(contentStart, nextIndex);
              
              docContent = docContent.replace(/\r?\n\r?\n$/, '');
              mdFiles.push({
                indexStr: current.indexStr,
                title: current.title,
                content: docContent.trim()
              });
            }

            importProjectFromParsedArray(mdFiles, projName);
          } catch (err) {
            console.error(err);
            showToast("기획 통합본 가공 실패.");
          }
          input.value = "";
        };
        reader.readAsText(file);
      } 
    }

    // 폴더 가져오기 트리 구조 복원 핸들러

    function handleFolderImport(input) {
      if (!input.files || input.files.length === 0) return;
      showToast("폴더 구조 스캔 및 복원 중...");

      const mdFiles = [];
      let parsedProjName = "가져온 프로젝트";

      for (let i = 0; i < input.files.length; i++) {
        const file = input.files[i];
        const pathParts = file.webkitRelativePath.split('/');
        if (pathParts.length > 1) {
          parsedProjName = pathParts[0]; 
        }

        const fname = file.name;
        if (fname.endsWith('.md')) {
          const match = fname.match(/^([0-9]+(?:\.[0-9]+)*)\.?\s*(.*?)\.md$/);
          if (match) {
            const indexStr = match[1];
            const title = match[2];
            
            const reader = new FileReader();
            reader.onload = (function(idx, t) {
              return function(e) {
                mdFiles.push({
                  indexStr: idx,
                  title: t,
                  content: e.target.result
                });
                
                if (mdFiles.length > 0 && i === input.files.length - 1) {
                  importProjectFromParsedArray(mdFiles, parsedProjName);
                }
              };
            })(indexStr, title);
            reader.readAsText(file);
          }
        }
      }
      input.value = "";
    }

    function importProjectFromParsedArray(mdFiles, overrideProjName) {
      mdFiles.sort((a, b) => {
        const aParts = a.indexStr.split('.').map(Number);
        const bParts = b.indexStr.split('.').map(Number);
        const minLen = Math.min(aParts.length, bParts.length);
        for (let i = 0; i < minLen; i++) {
          if (aParts[i] !== bParts[i]) return aParts[i] - bParts[i];
        }
        return aParts.length - bParts.length;
      });

      const projId = 'proj-' + Math.random().toString(36).substr(2, 9);
      let projName = overrideProjName || "가져온 프로젝트";
      const documents = {};
      const indexToDocId = {};

      const rootItem = mdFiles.find(item => item.indexStr === "0");
      if (rootItem) {
        if (!overrideProjName) {
          projName = rootItem.title;
        }
        documents["doc-root"] = {
          id: "doc-root",
          title: projName,
          parentId: null,
          childIds: [],
          content: rootItem.content
        };
        indexToDocId["0"] = "doc-root";
      } else {
        documents["doc-root"] = {
          id: "doc-root",
          title: projName,
          parentId: null,
          childIds: [],
          content: ""
        };
        indexToDocId["0"] = "doc-root";
      }

      mdFiles.forEach(item => {
        if (item.indexStr === "0") return;
        
        const currentId = 'doc-' + Math.random().toString(36).substr(2, 9);
        indexToDocId[item.indexStr] = currentId;

        documents[currentId] = {
          id: currentId,
          title: item.title,
          parentId: null,
          childIds: [],
          content: item.content
        };
      });

      mdFiles.forEach(item => {
        if (item.indexStr === "0") return;
        
        const currentId = indexToDocId[item.indexStr];
        const lastDotIdx = item.indexStr.lastIndexOf('.');
        const parentIndexStr = lastDotIdx === -1 ? "0" : item.indexStr.substring(0, lastDotIdx);
        const parentId = indexToDocId[parentIndexStr];

        if (parentId && documents[parentId]) {
          documents[currentId].parentId = parentId;
          documents[parentId].childIds.push(currentId);
        } else {
          documents[currentId].parentId = "doc-root";
          documents["doc-root"].childIds.push(currentId);
        }
      });

      appState.projects[projId] = {
        id: projId,
        name: projName,
        activeDocId: "doc-root",
        expandedNodes: ["doc-root"],
        documents: documents
      };
      
      appState.activeProjectId = projId;
      saveStateToCache();
      launcherSelectedProjectId = projId;
      enterWorkspace(projId);
      showToast("기획서 원복 완료!");
    }

    function renderQuickLinkList(filterText) {
      const container = document.getElementById("quick-link-list");
      container.innerHTML = "";
      
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      
      const query = filterText.toLowerCase().trim();
      const items = [];
      
      for (const docId in proj.documents) {
        const doc = proj.documents[docId];
        const meta = uuidToMetaMap.get(docId) || { index: "", title: doc.title };
        const label = `${meta.index}. ${doc.title}`;
        
        if (query === "" || label.toLowerCase().includes(query)) {
          items.push({ id: docId, label: label, doc: doc, meta: meta });
        }
      }
      
      if (items.length === 0) {
        container.innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:12px 0;">결과 없음</div>';
        return;
      }
      
      items.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "quick-pick-item" + (idx === selectedQuickPickIndex ? " selected" : "");
        row.onclick = () => {
          insertQuickLink(item.id);
        };
        row.innerHTML = `
          <span>${item.label}</span>
          <span style="font-size: 10px; color: var(--text-muted);">[[${item.meta.index}. ${item.doc.title}]]</span>
        `;
        container.appendChild(row);
      });

      document.getElementById("quick-link-search").addEventListener("keydown", function(e) {
        const listContainer = document.getElementById("quick-link-list");
        const items = listContainer.querySelectorAll(".quick-pick-item");
        
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (items.length > 0) {
            items[selectedQuickPickIndex].classList.remove("selected");
            selectedQuickPickIndex = (selectedQuickPickIndex + 1) % items.length;
            items[selectedQuickPickIndex].classList.add("selected");
            items[selectedQuickPickIndex].scrollIntoView({ block: "nearest" });
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (items.length > 0) {
            items[selectedQuickPickIndex].classList.remove("selected");
            selectedQuickPickIndex = (selectedQuickPickIndex - 1 + items.length) % items.length;
            items[selectedQuickPickIndex].classList.add("selected");
            items[selectedQuickPickIndex].scrollIntoView({ block: "nearest" });
          }
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (items.length > 0 && items[selectedQuickPickIndex]) {
            items[selectedQuickPickIndex].click();
          }
        } else if (e.key === "Escape") {
          e.preventDefault();
          closeQuickLinkModal();
        }
      });
    }

    function insertQuickLink(targetDocId) {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const targetDoc = proj.documents[targetDocId];
      if (!targetDoc) return;
      
      const meta = uuidToMetaMap.get(targetDocId);
      const indexStr = meta ? meta.index : "";

    function findBacklinksWithContext(targetDocId) {
      const proj = appState.projects[appState.activeProjectId];
      const backlinks = [];
      if (!proj) return backlinks;

      const targetDoc = proj.documents[targetDocId];
      if (!targetDoc) return backlinks;

      for (const docId in proj.documents) {
        if (docId === targetDocId) continue; 

        const doc = proj.documents[docId];
        if (!doc.content) continue;

        // 탭 문자 공백 동기화 변환 수행 후 탐색
        const content = doc.content.replace(/\t/g, "  ");
        const wikiRegex = /\[\[([^\]\n]+)\]\]/g;
        let match;
        while ((match = wikiRegex.exec(content)) !== null) {
          const linkContent = match[1];
          const resolvedId = resolveLink(linkContent);
          
          let isMatch = (resolvedId === targetDocId);
          if (!isMatch && targetDoc.title) {
            const trimmedLink = linkContent.trim();
            if (trimmedLink === targetDoc.title || trimmedLink.endsWith(". " + targetDoc.title) || trimmedLink.endsWith("." + targetDoc.title)) {
              isMatch = true;
            }
          }

          if (isMatch) {
            const linkStartIdx = match.index;
            const linkEndIdx = wikiRegex.lastIndex;
            
            const lastNewline = content.lastIndexOf('\n', linkStartIdx);
            const lineStart = lastNewline === -1 ? 0 : lastNewline + 1;
            
            const nextNewline = content.indexOf('\n', linkEndIdx);
            const lineEnd = nextNewline === -1 ? content.length : nextNewline;
            
            const line = content.substring(lineStart, lineEnd);
            const localStart = linkStartIdx - lineStart;
            const localEnd = linkEndIdx - lineStart;
            
            let beforeText = line.substring(Math.max(0, localStart - 35), localStart);
            if (localStart > 35) beforeText = "..." + beforeText;
            
            let afterText = line.substring(localEnd, Math.min(line.length, localEnd + 35));
            if (localEnd + 35 < line.length) afterText = afterText + "...";

            const contextPreview = `${beforeText} <span style="color:#52a9ff; font-weight:bold; border-bottom: 1.5px dashed #52a9ff;">[[${linkContent}]]</span> ${afterText}`;

            // 역링크 발생 행(Line) 번호 추출
            const lineNum = content.substring(0, linkStartIdx).split('\n').length;

            backlinks.push({
              id: docId,
              title: doc.title, // 수치 인덱스를 전면 노출 제외
              context: contextPreview.trim(),
              absoluteCharIndex: linkStartIdx,
              linkLength: match[0].length,
              lineNum: lineNum
            });
          }
        }
      }
      return backlinks;
    }

      const isInputField = e.target.tagName === 'INPUT' || 
                           (e.target.tagName === 'TEXTAREA' && e.target.id !== 'document-editor');
      const isSelectField = e.target.tagName === 'SELECT' || e.target.closest('.launcher-dashboard');

        return; 
      }

        showEditorContextMenu(e);

    async function editorPaste() {
      const textarea = document.getElementById("document-editor");
      if (!textarea) return;
      textarea.focus();
      try {
        const text = await navigator.clipboard.readText();
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const val = textarea.value;
        textarea.value = val.substring(0, start) + text + val.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + text.length;
        handleEditorRealtimeInput({ type: "input" });
        updateFooterStats();
      } catch (err) {
        console.warn("Clipboard read failed, trying execCommand fallback:", err);
        try {
          document.execCommand('paste');
        } catch (e) {
          showToast("Ctrl+V 단축키를 이용해 주세요.");
        }
      }
    }

      const textarea = document.getElementById("document-editor");
      const start = textarea.selectionStart;

      // 선택한 단어가 찾기 쿼리와 정확히 일치할 때 변경 수행
      if (text.substring(start, end) === findQuery) {

        textarea.selectionStart = start;
        textarea.selectionEnd = start + replaceText.length;

        // 선택이 되어있지 않다면, 순차 검색 후 바꾸기 대치
        let nextIdx = text.indexOf(findQuery, start);
        if (nextIdx === -1) nextIdx = text.indexOf(findQuery, 0);
        if (nextIdx !== -1) {
          textarea.value = text.substring(0, nextIdx) + replaceText + text.substring(nextIdx + findQuery.length);
          textarea.selectionStart = nextIdx;
          textarea.selectionEnd = nextIdx + replaceText.length;
          handleEditorRealtimeInput({ type: "input" });
          updateFooterStats();
        }
      }
      executeReplaceFindNext();
    }

      container.innerHTML = "";
      if (!query) return;

      let found = false;
      for (const docId in proj.documents) {
        const doc = proj.documents[docId];
        if (doc.content && doc.content.toLowerCase().includes(query)) {
          const lines = doc.content.split('\n');
          
          for (let idx = 0; idx < lines.length; idx++) {
            const line = lines[idx];

              found = true;

                  const textarea = document.getElementById("document-editor");
                  if (textarea) {
                    const linesNow = textarea.value.split('\n');

                    for (let j = 0; j < lineNum - 1; j++) {
                      targetIdx += linesNow[j].length + 1; // 줄바꿈 개행문자 합산
                    }
                    const lineQueryIdx = linesNow[lineNum - 1].toLowerCase().indexOf(query);
                    if (lineQueryIdx !== -1) {
                      const finalSelectIdx = targetIdx + lineQueryIdx;
                      textarea.focus();
                      textarea.selectionStart = finalSelectIdx;
                      textarea.selectionEnd = finalSelectIdx + query.length;
                      scrollCursorIntoView();
                      updateFooterStats();
                    }
                  }
                }, 100);
              };

              item.innerHTML = `

                </div>
                <div style="font-size:10.5px; color:var(--text-muted); margin-top:2px;">${line.trim()}</div>
              `;
              container.appendChild(item);
            }

        container.innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:12px 0;">결과 없음</div>';
      }
    }

    // 상태 표시 통계 계산기
    function updateFooterStats() {
      const textarea = document.getElementById("document-editor");
      const statText = document.getElementById("status-stats-text");
      if (!textarea || !statText) return;

      const text = textarea.value;
      const charCount = text.length;

      const words = text.trim().split(/\s+/).filter(Boolean);
      const wordCount = words.length;

      const caretPos = textarea.selectionStart;
      const textBeforeCaret = text.substring(0, caretPos);
      const linesBefore = textBeforeCaret.split('\n');
      const lineNum = linesBefore.length;

      const allLines = text.split('\n');
      const currentLineText = allLines[lineNum - 1] || "";
      const colCount = currentLineText.length;

      // [따옴표 제거] 명시해주신 규격인 기호 C, W, LN, COL 및 오리지널 v1.1.0 테마 반영
      statText.innerText = `C ${charCount} | W ${wordCount} | LN ${lineNum} | COL ${colCount}`;
    }
