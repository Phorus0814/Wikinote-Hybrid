    function openGitHubRepo() {
      window.open("https://github.com/Phorus0814/Wikinote-Hybrid", "_blank");
    }

    // 복사 분기 드롭다운 토글러
    function toggleCopyDropdown(e) {
      e.stopPropagation();
      const menu = document.getElementById("copy-dropdown-menu");
      if (menu) {
        const isShow = menu.style.display === "flex";
        closeAllDropdowns();
        menu.style.display = isShow ? "none" : "flex";
      }
    }

    // 사이드바 WORKSPACE / SEARCH 탭 전환 처리부
    function switchSidebarTab(tabId) {
      const treeBtn = document.getElementById("tab-workspace-btn");
      const searchBtn = document.getElementById("tab-search-btn");
      const treeContainer = document.getElementById("tree-container");
      const searchPanel = document.getElementById("sidebar-search-panel");

      if (tabId === 'workspace') {
        if (treeBtn) treeBtn.classList.add("active");
        if (searchBtn) searchBtn.classList.remove("active");
        if (treeContainer) treeContainer.style.display = "block";
        if (searchPanel) searchPanel.style.display = "none";
      } else {
        if (treeBtn) treeBtn.classList.remove("active");
        if (searchBtn) searchBtn.classList.add("active");
        if (treeContainer) treeContainer.style.display = "none";
        if (searchPanel) searchPanel.style.display = "flex";
        
        if (document.getElementById("sidebar-find-input")) {
          document.getElementById("sidebar-find-input").focus();
        }
        runSidebarSearch();
      }
    }

    // 탐색 범위 변경 토글러
    function toggleSearchScope() {
      appState.searchScope = (appState.searchScope === 'local' ? 'global' : 'local');
      const swapBtn = document.getElementById("sidebar-search-swap-btn");
      if (swapBtn) {
        swapBtn.innerText = (appState.searchScope === 'local' ? "<" : "G");
      }
      runSidebarSearch();
    }

    function handleSidebarSearchInput() {
      const q = document.getElementById("sidebar-find-input").value;
      appState.searchQuery = q ? q : null;
      renderHighlightOverlay();
      runSidebarSearch();
    }

    // [최고성능 분할 검색 코어] 동적 문맥 수집 및 2단 가독성 출력
    let runSidebarSearch = function() {
      const container = document.getElementById("sidebar-search-results");
      if (!container) return;
      container.innerHTML = "";

      const q = appState.searchQuery ? appState.searchQuery.toLowerCase() : "";
      if (!q) {
        container.innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:12px 0;">검색어를 입력하세요.</div>';
        return;
      }

      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;

      const matches = [];

      function searchDoc(docId) {
        const doc = proj.documents[docId];
        if (!doc || !doc.content) return;

        // 탭 공백을 치환하여 캐럿 지목 정확도 확보
        const content = doc.content.replace(/\t/g, "  ");
        const lines = content.split('\n');

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const lineLower = line.toLowerCase();
          let sIdx = 0;

          // 한 문장에 타겟 단어가 여러 번 기입된 경우 정확하게 쪼개서 개별 리스트업
          while (true) {
            const matchIdx = lineLower.indexOf(q, sIdx);
            if (matchIdx === -1) break;

            // 절대 문자 오프셋 및 줄 번호 추출
            let absoluteOffset = 0;
            for (let j = 0; j < i; j++) {
              absoluteOffset += lines[j].length + 1; // 개행문자 포함
            }
            const linkStartIdx = absoluteOffset + matchIdx;

            let beforeText = line.substring(Math.max(0, matchIdx - 15), matchIdx);
            if (matchIdx > 15) beforeText = "..." + beforeText;

            let afterText = line.substring(matchIdx + q.length, Math.min(line.length, matchIdx + q.length + 15));
            if (matchIdx + q.length + 15 < line.length) afterText = afterText + "...";

            // 회색 하이라이트 지목 문맥 가공
            const contextPreview = `${beforeText}<span style="background-color:rgba(128,128,128,0.45); border-radius:2px; padding:0 2px;">${line.substring(matchIdx, matchIdx + q.length)}</span>${afterText}`;

            const meta = uuidToMetaMap.get(docId) || { index: "", title: doc.title };
            matches.push({
              id: docId,
              index: meta.index,
              title: doc.title,
              context: contextPreview.trim(),
              absoluteCharIndex: linkStartIdx,
              linkLength: q.length,
              lineNum: i + 1
            });

            sIdx = matchIdx + q.length;
          }
        }
      }

      if (appState.searchScope === 'local') {
        searchDoc(proj.activeDocId);
      } else {
        for (const docId in proj.documents) {
          searchDoc(docId);
        }
      }

      if (matches.length === 0) {
        container.innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:12px 0;">매칭 결과가 없습니다.</div>';
        return;
      }

      // [Case 3 완결 개정] 2단 깔끔 컴팩트 레이아웃 드로잉
      matches.forEach(item => {
        const row = document.createElement("div");
        row.className = "quick-pick-item";
        row.style.flexDirection = "column";
        row.style.alignItems = "stretch";
        row.style.gap = "4px";
        row.style.padding = "8px 10px";
        row.style.marginBottom = "6px";
        row.style.cursor = "pointer";

        row.onclick = (e) => {
          if (e.target.closest('.modal-btn')) return; // 바꾸기 단추 조작 시 이동 동작 일시 차단
          selectDocument(item.id, proj.activeDocId, { charIndex: item.absoluteCharIndex, length: item.linkLength });
        };

        const titleText = (appState.searchScope === 'global' ? `${item.index}. ${item.title}` : `${item.title}`);

        row.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
            <span style="font-weight:bold; color:var(--text-white); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px;">
              ${titleText} <span style="font-size:9.5px; color:var(--text-muted); font-weight:normal; margin-left:4px;">(LN ${item.lineNum})</span>
            </span>
            <button class="modal-btn primary" style="padding:2px 8px; font-size:9.5px; height:18px; border-radius:3px;" onclick="executeSidebarSingleReplace(event, '${item.id}', ${item.absoluteCharIndex}, ${item.linkLength})">바꾸기</button>
          </div>
          <div style="font-size:10.5px; color:var(--text-main); font-family:Consolas, monospace; background-color:var(--bg-menu); padding:4px 6px; border-radius:3px; border:1px solid var(--border-color); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3; margin-top:2px;">
            ${item.context}
          </div>
        `;
        container.appendChild(row);
      });
    }

    // 개별 항목 바꾸기 구동 단추
    function executeSidebarSingleReplace(e, docId, absoluteCharIndex, linkLength) {
      e.stopPropagation();
      const replaceVal = document.getElementById("sidebar-replace-input").value;
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const doc = proj.documents[docId];
      if (!doc) return;

      const text = doc.content || "";
      const updated = text.substring(0, absoluteCharIndex) + replaceVal + text.substring(absoluteCharIndex + linkLength);
      doc.content = updated;

      if (docId === proj.activeDocId) {
        const textarea = document.getElementById("document-editor");
        if (textarea) {
          textarea.value = updated.replace(/\t/g, "  ");
          handleEditorRealtimeInput({ type: "input" });
        }
      } else {
        saveStateToCache();
      }

      showToast("바뀜"); // [피드백 완결] 설명 배제형 극축약 표식
      runSidebarSearch();
    }

    // 범위 전역 일괄 바꾸기 가동 장치
    function executeSidebarReplaceAll() {
      const replaceVal = document.getElementById("sidebar-replace-input").value;
      const q = appState.searchQuery ? appState.searchQuery.toLowerCase() : "";
      if (!q) return;

      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;

      showToast("바뀜");
      let changed = false;

      function replaceInDoc(docId) {
        const doc = proj.documents[docId];
        if (!doc || !doc.content) return;

        const text = doc.content;
        const lower = text.toLowerCase();
        let updated = "";
        let sIdx = 0;
        let found = false;

        while (true) {
          const matchIdx = lower.indexOf(q, sIdx);
          if (matchIdx === -1) {
            updated += text.substring(sIdx);
            break;
          }
          updated += text.substring(sIdx, matchIdx) + replaceVal;
          sIdx = matchIdx + q.length;
          found = true;
        }

        if (found) {
          doc.content = updated;
          changed = true;
          if (docId === proj.activeDocId) {
            const textarea = document.getElementById("document-editor");
            if (textarea) {
              textarea.value = updated.replace(/\t/g, "  ");
              handleEditorRealtimeInput({ type: "input" });
            }
          }
        }
      }

      if (appState.searchScope === 'local') {
        replaceInDoc(proj.activeDocId);
      } else {
        for (const docId in proj.documents) {
          replaceInDoc(docId);
        }
      }

      if (changed) {
        saveStateToCache();
        runSidebarSearch();
      }
    }

    function initShortcuts() {
      window.addEventListener('keydown', (e) => {
        const proj = appState.projects[appState.activeProjectId];

        if (e.key === 'F1') {
          e.preventDefault();
          showShortcutModal();
          return;
        }

        if (e.key === 'Delete' || e.key === 'Del') {
          const activeTag = document.activeElement ? document.activeElement.tagName : '';
          if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA') {
            e.preventDefault();
            performDelete();
            return;
          }
        }

        const isCmdOrCtrl = e.ctrlKey || e.metaKey;
        if (isCmdOrCtrl) {
          if (e.key.toLowerCase() === 's') {
            e.preventDefault();
            manualBackupTrigger();
          } else if (e.key.toLowerCase() === 'n') {
            e.preventDefault();
            if (e.shiftKey) {
              createNewProjectFromLauncher();
            } else {
              createNewDocumentNodeDirect();
            }
          } else if (e.key.toLowerCase() === 'b') {
            e.preventDefault();
            togglePanel('left');
          } else if (e.key.toLowerCase() === 'l') {
            e.preventDefault();
            showQuickLinkModal();
          } else if (e.key.toLowerCase() === 'e') {
            e.preventDefault();
            exportProjectToZip();
          } else if (e.key.toLowerCase() === 'o') {
            e.preventDefault();
            triggerProjectImport();
          } else if (e.key.toLowerCase() === 'p') {
            e.preventDefault();
            switchSidebarTab('search'); // 사이드바 서치포커스 자동매핑 연동
          } else if (e.key.toLowerCase() === 'q') {
            e.preventDefault();
            closeAppWindow();
          } else if (e.key.toLowerCase() === 'f') {
            e.preventDefault();
            switchSidebarTab('search');
            if (e.shiftKey) {
              appState.searchScope = 'global';
              const swapBtn = document.getElementById("sidebar-search-swap-btn");
              if (swapBtn) swapBtn.innerText = "G";
            } else {
              appState.searchScope = 'local';
              const swapBtn = document.getElementById("sidebar-search-swap-btn");
              if (swapBtn) swapBtn.innerText = "<";
            }
            const textarea = document.getElementById("document-editor");
            const selText = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd);
            if (selText) {
              if (document.getElementById("sidebar-find-input")) {
                document.getElementById("sidebar-find-input").value = selText;
              }
              appState.searchQuery = selText;
              renderHighlightOverlay();
            }
            runSidebarSearch();
          } else if (e.key.toLowerCase() === 'h') {
            e.preventDefault();
            switchSidebarTab('search');
            const textarea = document.getElementById("document-editor");
            const selText = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd);
            if (selText) {
              if (document.getElementById("sidebar-find-input")) {
                document.getElementById("sidebar-find-input").value = selText;
              }
              appState.searchQuery = selText;
              renderHighlightOverlay();
            }
            if (document.getElementById("sidebar-replace-input")) {
              document.getElementById("sidebar-replace-input").focus();
            }
            runSidebarSearch();
          } else if (e.key.toLowerCase() === 'c') {
            // [사이드바 복사 통제] 포커스가 트리 사이드바 영역에 닿아있다면 해당 노드를 정교하게 가공 복사
            const isSidebarActive = document.activeElement && (document.activeElement.id === "panel-left" || document.activeElement.closest("#panel-left"));
            if (isSidebarActive) {
              if (proj && proj.activeDocId) {
                contextMenuTargetId = proj.activeDocId;
                contextCopyDoc();
              }
              return;
            }
            if (e.shiftKey) {
              e.preventDefault();
              copyDocumentToClipboardDirect();
            }
          } else if (e.key.toLowerCase() === 'x') {
            // [사이드바 잘라내기 통제] 포커스가 트리 사이드바 영역일 때 트리 잘라내기 기동
            const isSidebarActive = document.activeElement && (document.activeElement.id === "panel-left" || document.activeElement.closest("#panel-left"));
            if (isSidebarActive) {
              if (proj && proj.activeDocId) {
                contextMenuTargetId = proj.activeDocId;
                contextCutDoc();
              }
              return;
            }
          } else if (e.key.toLowerCase() === 'v') {
            // [사이드바 붙여넣기 통제] 포커스가 트리 사이드바 영역일 때 트리 붙여넣기 기동
            const isSidebarActive = document.activeElement && (document.activeElement.id === "panel-left" || document.activeElement.closest("#panel-left"));
            if (isSidebarActive) {
              if (proj && proj.activeDocId) {
                contextMenuTargetId = proj.activeDocId;
                contextPasteDoc();
              }
              return;
            }
          } else if (e.key.toLowerCase() === 'a') {
            if (e.altKey) {
              e.preventDefault();
              copyAllToClipboardDirect();
            }
          }
        }
        
        if (e.altKey) {
          if (e.key.toLowerCase() === 'c') {
            e.preventDefault();
            if (e.shiftKey) {
              copySubtreeToClipboardDirect();
            } else {
              showColorPaletteModal();
            }
          } else if (e.key.toLowerCase() === 'b') {
            e.preventDefault();
            showBacklinksModal();
          }
        }

        if (e.key === 'F5') {
          e.preventDefault();
          insertDateTimeAtCaret();
        }
      });
    }
  </script>
