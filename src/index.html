    function handleProjectImport(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const filename = file.name;
      const extension = filename.split('.').pop().toLowerCase();

      showToast("패키지 파일 검증 중...");

      if (extension === 'zip' || extension === '7z') {
        if (typeof JSZip === 'undefined') {
          openCustomConfirm("가져오기 실패", "가져오기 엔진 호출 실패", () => {});
          input.value = "";
          return;
        }

        const reader = new FileReader();
        reader.onload = async function(e) {
          try {
            const zip = await JSZip.loadAsync(e.target.result);
            const mdFiles = [];
            
            for (const [relativePath, fileInfo] of Object.entries(zip.files)) {
              if (fileInfo.dir || !relativePath.endsWith('.md')) continue;
              
              const fname = relativePath.split('/').pop();
              const match = fname.match(/^([0-9]+(?:\.[0-9]+)*)\.?\s*(.*?)\.md$/);
              if (match) {
                const indexStr = match[1];
                const title = match[2];
                const content = await fileInfo.async("text");
                mdFiles.push({ indexStr, title, content });
              }
            }

            if (mdFiles.length === 0) {
              openCustomConfirm("가져오기 실패", "해당 형식은 지원하지 않습니다.", () => {});
              input.value = "";
              return;
            }

            importProjectFromParsedArray(mdFiles);
          } catch (err) {
            console.error(err);
            openCustomConfirm("가져오기 실패", "해당 형식은 지원하지 않습니다.", () => {});
          }
          input.value = "";
        };
        reader.readAsArrayBuffer(file);
      } 
      else if (extension === 'txt') {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const fileContent = e.target.result;
            
            if (!fileContent.includes("[통합본]")) {
              openCustomConfirm("가져오기 실패", "해당 형식은 지원하지 않습니다.", () => {});
              input.value = "";
              return;
            }

            let projName = "가져온 프로젝트";
            const projNameMatch = fileContent.match(/\[통합본\]\s*(.*?)\s*기획 문서 목록/);
            if (projNameMatch) {
              projName = projNameMatch[1].trim();
            }

            const headerRegex = /^(0|[1-9]\d*(?:\.[0-9]+)*)\.?\s*([^\n]+)\r?\n-{10,}\r?\n/gm;
            const matches = [];
            let match;
            while ((match = headerRegex.exec(fileContent)) !== null) {
              matches.push({
                index: match.index,
                indexStr: match[1],
                title: match[2].trim(),
                headerLength: match[0].length
              });
            }

            if (matches.length === 0) {
              openCustomConfirm("가져오기 실패", "해당 형식은 지원하지 않습니다.", () => {});
              input.value = "";
              return;
            }

            const mdFiles = [];
            for (let i = 0; i < matches.length; i++) {
              const current = matches[i];
              const nextIndex = (i + 1 < matches.length) ? matches[i + 1].index : fileContent.length;
              const contentStart = current.index + current.headerLength;
              let docContent = fileContent.substring(contentStart, nextIndex);
              
              docContent = docContent.replace(/\r?\n\r?\n$/, '');
              mdFiles.push({
                indexStr: current.indexStr,
                title: current.title,
                content: docContent.trim()
              });
            }

            importProjectFromParsedArray(mdFiles, projName);
          } catch (err) {
            console.error(err);
            openCustomConfirm("가져오기 실패", "해당 형식은 지원하지 않습니다.", () => {});
          }
          input.value = "";
        };
        reader.readAsText(file);
      } 
      else {
        openCustomConfirm("가져오기 실패", "해당 형식은 지원하지 않습니다.", () => {});
        input.value = "";
      }
    }

    function importProjectFromParsedArray(mdFiles, overrideProjName) {
      mdFiles.sort((a, b) => {
        const aParts = a.indexStr.split('.').map(Number);
        const bParts = b.indexStr.split('.').map(Number);
        const minLen = Math.min(aParts.length, bParts.length);
        for (let i = 0; i < minLen; i++) {
          if (aParts[i] !== bParts[i]) return aParts[i] - bParts[i];
        }
        return aParts.length - bParts.length;
      });

      const projId = 'proj-' + Math.random().toString(36).substr(2, 9);
      let projName = overrideProjName || "가져온 프로젝트";
      const documents = {};
      const indexToDocId = {};

      const rootItem = mdFiles.find(item => item.indexStr === "0");
      if (rootItem) {
        if (!overrideProjName) {
          projName = rootItem.title;
        }
        documents["doc-root"] = {
          id: "doc-root",
          title: projName,
          parentId: null,
          childIds: [],
          content: rootItem.content
        };
        indexToDocId["0"] = "doc-root";
      } else {
        documents["doc-root"] = {
          id: "doc-root",
          title: projName,
          parentId: null,
          childIds: [],
          content: ""
        };
        indexToDocId["0"] = "doc-root";
      }

      mdFiles.forEach(item => {
        if (item.indexStr === "0") return;
        
        const currentId = 'doc-' + Math.random().toString(36).substr(2, 9);
        indexToDocId[item.indexStr] = currentId;

        documents[currentId] = {
          id: currentId,
          title: item.title,
          parentId: null,
          childIds: [],
          content: item.content
        };
      });

      mdFiles.forEach(item => {
        if (item.indexStr === "0") return;
        
        const currentId = indexToDocId[item.indexStr];
        const lastDotIdx = item.indexStr.lastIndexOf('.');
        const parentIndexStr = lastDotIdx === -1 ? "0" : item.indexStr.substring(0, lastDotIdx);
        const parentId = indexToDocId[parentIndexStr];

        if (parentId && documents[parentId]) {
          documents[currentId].parentId = parentId;
          documents[parentId].childIds.push(currentId);
        } else {
          documents[currentId].parentId = "doc-root";
          documents["doc-root"].childIds.push(currentId);
        }
      });

      appState.projects[projId] = {
        id: projId,
        name: projName,
        activeDocId: "doc-root",
        expandedNodes: ["doc-root"],
        documents: documents
      };
      
      appState.activeProjectId = projId;
      saveStateToCache();

      launcherSelectedProjectId = projId;
      
      enterWorkspace(projId);
      showToast("가져온 프로젝트를 자동으로 열었습니다!");
    }

    function openMergeFileDialog() {
      document.getElementById("merge-file-input").click();
    }

    function processFileMerge(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const textToMerge = e.target.result;
        const textarea = document.getElementById("document-editor");
        if (textarea) {
          const currentText = textarea.value;
          const mergedText = currentText + (currentText ? "\n\n" : "") + textToMerge;
          textarea.value = mergedText;
          
          handleEditorRealtimeInput({ target: textarea });
          showToast(`"${file.name}" 내용 병합 완료!`);
        }
        input.value = "";
      };
      reader.readAsText(file);
    }

    function showToast(message) {
      const toast = document.getElementById("toast-notice");
      if (toast) {
        toast.innerText = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
      }
    }

    function initResizerPanel() {
      const resizerLeft = document.getElementById("resizer-left");
      const sidebarLeft = document.getElementById("panel-left");

      if (resizerLeft && sidebarLeft) {
        resizerLeft.addEventListener("mousedown", (e) => {
          e.preventDefault();
          resizerLeft.classList.add("dragging");
          function onMouseMove(moveEvent) {
            const newWidth = moveEvent.clientX;
            if (newWidth > 150 && newWidth < 600) {
              sidebarLeft.style.width = newWidth + "px";
            }
          }
          function onMouseUp() {
            resizerLeft.classList.remove("dragging");
            document.removeEventListener("mousemove", onMouseMove);
            document.removeEventListener("mouseup", onMouseUp);
          }
          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onMouseUp);
        });
      }
    }

    function showQuickLinkModal() {
      const modal = document.getElementById("quick-link-backdrop");
      const searchInput = document.getElementById("quick-link-search");
      searchInput.value = "";
      selectedQuickPickIndex = 0;
      modal.classList.add("show");
      searchInput.focus();
      
      renderQuickLinkList("");
    }

    function closeQuickLinkModal() {
      const modal = document.getElementById("quick-link-backdrop");
      modal.classList.remove("show");
      document.getElementById("document-editor").focus();
    }

    function renderQuickLinkList(filterText) {
      const container = document.getElementById("quick-link-list");
      container.innerHTML = "";
      
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      
      const query = filterText.toLowerCase().trim();
      const items = [];
      
      for (const docId in proj.documents) {
        const doc = proj.documents[docId];
        const meta = uuidToMetaMap.get(docId) || { index: "", title: doc.title };
        const label = `${meta.index}. ${doc.title}`;
        
        if (query === "" || label.toLowerCase().includes(query)) {
          items.push({ id: docId, label: label, doc: doc, meta: meta });
        }
      }
      
      if (items.length === 0) {
        container.innerHTML = '<div style="font-size:11px; color:#858585; text-align:center; padding:12px 0;">결과 없음</div>';
        return;
      }
      
      items.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "quick-pick-item" + (idx === selectedQuickPickIndex ? " selected" : "");
        row.onclick = () => {
          insertQuickLink(item.id);
        };
        row.innerHTML = `
          <span>${item.label}</span>
          <span style="font-size: 10px; color: #858585;">[[${item.meta.index}. ${item.doc.title}]]</span>
        `;
        container.appendChild(row);
      });
    }

    function filterQuickLinks() {
      const searchInput = document.getElementById("quick-link-search");
      selectedQuickPickIndex = 0;
      renderQuickLinkList(searchInput.value);
    }

    document.getElementById("quick-link-search").addEventListener("keydown", function(e) {
      const listContainer = document.getElementById("quick-link-list");
      const items = listContainer.querySelectorAll(".quick-pick-item");
      
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (items.length > 0) {
          items[selectedQuickPickIndex].classList.remove("selected");
          selectedQuickPickIndex = (selectedQuickPickIndex + 1) % items.length;
          items[selectedQuickPickIndex].classList.add("selected");
          items[selectedQuickPickIndex].scrollIntoView({ block: "nearest" });
        }
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (items.length > 0) {
          items[selectedQuickPickIndex].classList.remove("selected");
          selectedQuickPickIndex = (selectedQuickPickIndex - 1 + items.length) % items.length;
          items[selectedQuickPickIndex].classList.add("selected");
          items[selectedQuickPickIndex].scrollIntoView({ block: "nearest" });
        }
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (items.length > 0 && items[selectedQuickPickIndex]) {
          items[selectedQuickPickIndex].click();
        }
      } else if (e.key === "Escape") {
        e.preventDefault();
        closeQuickLinkModal();
      }
    });

    function insertQuickLink(targetDocId) {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;
      const targetDoc = proj.documents[targetDocId];
      if (!targetDoc) return;
      
      const meta = uuidToMetaMap.get(targetDocId);
      const indexStr = meta ? meta.index : "";
      const linkText = `[[${indexStr ? indexStr + ". " : ""}${targetDoc.title}]]`;
      
      const textarea = document.getElementById("document-editor");
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      
      textarea.value = text.substring(0, start) + linkText + text.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + linkText.length;
      
      closeQuickLinkModal();
      handleEditorRealtimeInput({ target: textarea });
    }

    function renderColorPaletteGrid() {
      const grid = document.getElementById("color-palette-grid");
      if (!grid) return;
      grid.innerHTML = "";

      Object.entries(colorMap).forEach(([char, info]) => {
        const card = document.createElement("div");
        card.className = "color-pick-card";
        card.setAttribute("data-char", char);
        card.onclick = () => applySelectedColor(char);

        card.innerHTML = `
          <div class="color-pick-indicator" style="background-color: ${info.hex}; box-shadow: 0 0 4px ${info.hex}80;"></div>
          <span class="color-pick-text">${info.name}</span>
          <span class="color-pick-badge" style="background-color: #2b2b2b; color: #fff; border: 1px solid #444;">${char.toUpperCase()}</span>
        `;
        grid.appendChild(card);
      });
    }

    function showColorPaletteModal() {
      const textarea = document.getElementById("document-editor");
      if (!textarea) return;

      selectionBackup.start = textarea.selectionStart;
      selectionBackup.end = textarea.selectionEnd;

      const modal = document.getElementById("color-palette-backdrop");
      modal.classList.add("show");

      const cards = document.querySelectorAll(".color-pick-card");
      cards.forEach(c => c.classList.remove("focused"));
      if (cards[0]) cards[0].classList.add("focused");
    }

    function closeColorPaletteModal() {
      const modal = document.getElementById("color-palette-backdrop");
      modal.classList.remove("show");
      document.getElementById("document-editor").focus();
    }

    function applySelectedColor(colorChar) {
      const textarea = document.getElementById("document-editor");
      if (!textarea) return;

      const start = selectionBackup.start;
      const end = selectionBackup.end;
      const text = textarea.value;
      const selectedText = text.substring(start, end);

      const wrapped = `$${colorChar}${selectedText}$`;
      textarea.value = text.substring(0, start) + wrapped + text.substring(end);

      if (start === end) {
        textarea.selectionStart = textarea.selectionEnd = start + 2;
      } else {
        textarea.selectionStart = start;
        textarea.selectionEnd = start + wrapped.length;
      }

      closeColorPaletteModal();
      handleEditorRealtimeInput({ target: textarea });
      showToast(`'${colorMap[colorChar]?.name || "Color"}' 강조 스타일이 적용되었습니다.`);
    }

    window.addEventListener("keydown", function(e) {
      const palette = document.getElementById("color-palette-backdrop");
      if (palette && palette.classList.contains("show")) {
        const key = e.key.toLowerCase();
        if (e.key === "Escape") {
          e.preventDefault();
          closeColorPaletteModal();
          return;
        }
        if (colorMap[key]) {
          e.preventDefault();
          applySelectedColor(key);
        }
      }

      const backlinksModal = document.getElementById("backlinks-backdrop");
      if (backlinksModal && backlinksModal.classList.contains("show")) {
        if (e.key === "Escape") {
          e.preventDefault();
          closeBacklinksModal();
        }
      }
    });

    // [Case 3 완결 조율] 가상 탭공백 동기화 변환 처리를 거쳐 중복된 역링크 지점의 절대적인 위치 구조를 전부 개별 색인
    function findBacklinksWithContext(targetDocId) {
      const proj = appState.projects[appState.activeProjectId];
      const backlinks = [];
      if (!proj) return backlinks;

      const targetDoc = proj.documents[targetDocId];
      if (!targetDoc) return backlinks;

      for (const docId in proj.documents) {
        if (docId === targetDocId) continue; 

        const doc = proj.documents[docId];
        if (!doc.content) continue;

        // 탭 공백 변환 처리를 미리 수행하여 문자 인덱스의 일관성을 확보
        const content = doc.content.replace(/\t/g, "  ");
        const wikiRegex = /\[\[([^\]\n]+)\]\]/g;
        let match;
        
        while ((match = wikiRegex.exec(content)) !== null) {
          const linkContent = match[1];
          const resolvedId = resolveLink(linkContent);
          
          let isMatch = (resolvedId === targetDocId);
          // 차선 대칭 타이틀 추적 처리 작동
          if (!isMatch && targetDoc.title) {
            const trimmedLink = linkContent.trim();
            if (trimmedLink === targetDoc.title || trimmedLink.endsWith(". " + targetDoc.title) || trimmedLink.endsWith("." + targetDoc.title)) {
              isMatch = true;
            }
          }

          if (isMatch) {
            const linkStartIdx = match.index;
            const linkEndIdx = wikiRegex.lastIndex;
            
            // 줄 단위 기점 분기 슬라이스 검사
            const lastNewline = content.lastIndexOf('\n', linkStartIdx);
            const lineStart = lastNewline === -1 ? 0 : lastNewline + 1;
            
            const nextNewline = content.indexOf('\n', linkEndIdx);
            const lineEnd = nextNewline === -1 ? content.length : nextNewline;
            
            const line = content.substring(lineStart, lineEnd);
            
            const localStart = linkStartIdx - lineStart;
            const localEnd = linkEndIdx - lineStart;
            
            let beforeText = line.substring(Math.max(0, localStart - 35), localStart);
            if (localStart > 35) beforeText = "..." + beforeText;
            
            let afterText = line.substring(localEnd, Math.min(line.length, localEnd + 35));
            if (localEnd + 35 < line.length) afterText = afterText + "...";

            const contextPreview = `${beforeText} <span style="color:#52a9ff; font-weight:bold; border-bottom: 1.5px dashed #52a9ff;">[[${linkContent}]]</span> ${afterText}`;

            const meta = uuidToMetaMap.get(docId) || { index: "", title: doc.title };
            backlinks.push({
              id: docId,
              index: meta.index,
              title: doc.title,
              context: contextPreview.trim(),
              // 고유 지점을 정확하게 찾아가도록 절대 문자 오프셋 및 물리적 길이를 저장
              absoluteCharIndex: linkStartIdx,
              linkLength: match[0].length
            });
          }
        }
      }
      return backlinks;
    }

    function showBacklinksModal(docId) {
      const proj = appState.projects[appState.activeProjectId];
      if (!proj) return;

      const targetId = docId || proj.activeDocId;
      const targetDoc = proj.documents[targetId];
      if (!targetDoc) return;

      const meta = uuidToMetaMap.get(targetId) || { index: "0", title: targetDoc.title };
      const titleLabel = targetId === "doc-root" ? targetDoc.title : `${meta.index}. ${targetDoc.title}`;

      const titleEl = document.getElementById("backlinks-modal-title");
      if (titleEl) {
        titleEl.innerText = `"${titleLabel}" 역링크 목록`;
      }

      const container = document.getElementById("backlinks-list");
      if (!container) return;
      container.innerHTML = "";

      const links = findBacklinksWithContext(targetId);

      if (links.length === 0) {
        container.innerHTML = `
          <div style="font-size: 11.5px; color: #858585; text-align: center; padding: 36px 0; line-height: 1.7;">
            이 문서를 가리키는 역링크가 아직 존재하지 않습니다.<br>
            <span style="font-size: 10px; color: #555555; margin-top: 6px; display: inline-block;">다른 기획 노트에 [[${targetId === "doc-root" ? targetDoc.title : meta.index + ". " + targetDoc.title}]] 구문을 적어 연결해 보세요.</span>
          </div>
        `;
      } else {
        links.forEach(item => {
          const row = document.createElement("div");
          row.className = "quick-pick-item";
          row.style.flexDirection = "column";
          row.style.alignItems = "stretch";
          row.style.gap = "6px";
          row.style.padding = "10px 12px";
          
          // [Case 3 완결] 역링크 클릭 시 정확하게 해당 지점으로 포지셔닝되도록 absoluteCharIndex 및 길이를 전달
          row.onclick = () => {
            selectDocument(item.id, proj.activeDocId, { charIndex: item.absoluteCharIndex, length: item.linkLength });
            closeBacklinksModal();
          };

          row.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
              <span style="font-weight: bold; color: #ffffff; font-size: 11.5px;">${item.index ? item.index + ". " : ""}${item.title}</span>
              <span style="font-size: 9.5px; color: #0e639c; font-weight: bold; background-color: rgba(14,99,156,0.15); padding: 1px 5px; border-radius: 3px;">이동 ⏎</span>
            </div>
            <div class="backlink-context-line" style="font-size: 11px; color: #a0a0a0; font-family: Consolas, monospace; background-color: #1a1a1a; padding: 6px 10px; border-radius: 4px; border: 1px solid #2d2d30; line-height: 1.5; margin-top: 4px;">
              ${item.context}
            </div>
          `;
          container.appendChild(row);
        });
      }

      const modal = document.getElementById("backlinks-backdrop");
      if (modal) {
        modal.classList.add("show");
      }
    }

    function closeBacklinksModal() {
      const modal = document.getElementById("backlinks-backdrop");
      if (modal) {
        modal.classList.remove("show");
      }
      const editor = document.getElementById("document-editor");
      if (editor) editor.focus();
    }

    function initShortcuts() {
      window.addEventListener('keydown', (e) => {
        if (e.key === 'F1') {
          e.preventDefault();
          showShortcutModal();
          return;
        }

        if (e.key === 'Delete' || e.key === 'Del') {
          const activeTag = document.activeElement ? document.activeElement.tagName : '';
          if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA') {
            e.preventDefault();
            performDelete();
            return;
          }
        }

        const isCmdOrCtrl = e.ctrlKey || e.metaKey;
        if (isCmdOrCtrl) {
          if (e.key.toLowerCase() === 's') {
            e.preventDefault();
            manualBackupTrigger();
          } else if (e.key.toLowerCase() === 'n') {
            e.preventDefault();
            createNewDocumentNode();
          } else if (e.key.toLowerCase() === 'b') {
            e.preventDefault();
            togglePanel('left');
          } else if (e.key.toLowerCase() === 'l') {
            e.preventDefault();
            showQuickLinkModal();
          }
        }
        
        if (e.altKey && e.key.toLowerCase() === 'c') {
          e.preventDefault();
          showColorPaletteModal();
        }

        if (e.altKey && e.key.toLowerCase() === 'b') {
          e.preventDefault();
          showBacklinksModal();
        }
      });
    }
  </script>
